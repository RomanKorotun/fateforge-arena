name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.PRIVATE_SSH_KEY }}

          script: |
            set -e

            # переходимо в папку проєкту на VPS
            cd /opt/fateforge-arena

            # тягнемо останні зміни з GitHub
            git pull origin main

            # створюємо .env.production з GitHub Secrets
            cat > .env.production <<EOF

            PORT=${{ secrets.PORT }}

            BACKEND_URL=${{ secrets.BACKEND_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}

            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}

            ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
            ACCESS_TOKEN_TIME=${{ secrets.ACCESS_TOKEN_TIME }}

            REDIS_URL=${{ secrets.REDIS_URL }}

            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}

            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
            DISCORD_CALLBACK_URL=${{ secrets.DISCORD_CALLBACK_URL }}

            LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}
            LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}
            LINKEDIN_CALLBACK_URL=${{ secrets.LINKEDIN_CALLBACK_URL }}

            FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}
            FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}
            FACEBOOK_CALLBACK_URL=${{ secrets.FACEBOOK_CALLBACK_URL }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}

            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            EOF

            # Перевіряємо, чи немає змінних без значення
            if grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[[:space:]]*$' .env.production; then
              echo "Empty environment variable detected:"
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=[[:space:]]*$' .env.production
              exit 1
            fi

            # build
            docker compose -f docker-compose.prod.yml build

            # migrations
            docker compose -f docker-compose.prod.yml run --rm migration

            # seed
            docker compose -f docker-compose.prod.yml run --rm seed

            # api
            docker compose -f docker-compose.prod.yml up -d api

            # очищення старих Docker image шарів
            docker image prune -f
